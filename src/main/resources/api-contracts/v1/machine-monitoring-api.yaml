openapi: 3.0.3
info:
  title: Machine Monitoring System API
  description: API for monitoring and managing machines in manufacturing line
  version: 1.0.0
  contact:
    name: Machine Monitoring Team
    email: support@mytech.com
  license:
    name: MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Development server
#  - url: https://api.machinesystem.com/v1
#    description: Production server

paths:
  /machines/status:
    post:
      tags:
        - Machine Monitoring
      summary: Get machine status with complex filtering
      description: Returns the status of machines based on complex filter criteria including failed product counts
      operationId: getMachineStatusWithFilters
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MachineStatusRequest'
            examples:
              simple:
                summary: Simple filter by machine ID
                value:
                  machineId: 1001
              complex:
                summary: Complex filter with multiple criteria
                value:
                  machineId: 1001
                  fixtureId: 22
                  channelNumber: 7
                  dateRange:
                    startDate: "2025-10-29T00:00:00Z"
                    endDate: "2025-10-29T23:59:59Z"
                  filters:
                    minFailedCount: 1
                    maxFailedCount: 10
                    batchSize: 500
      responses:
        '200':
          description: Successful response with machine status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineStatusResponse'
              examples:
                success:
                  summary: Example response
                  value:
                    machineId: 1001
                    rackId: 22
                    channelNumber: 7
                    batchSize: 500
                    failedProductCount: [2, 0, 1, 4]
                    timestamp: "2025-10-29T02:00:00Z"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "BAD_REQUEST"
                message: "Invalid filter criteria provided"
                timestamp: "2025-10-29T02:00:00Z"
                path: "/api/v1/machines/status"
        '404':
          description: No machines found matching criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "NOT_FOUND"
                message: "No machines found matching the specified criteria"
                timestamp: "2025-10-29T02:00:00Z"
                path: "/api/v1/machines/status"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "INTERNAL_SERVER_ERROR"
                message: "Internal server error occurred."
                timestamp: "2025-10-29T02:00:00Z"
                path: "/api/v1/machines/status"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for API authentication

  schemas:
    FailedProductDto:
      type: object
      properties:
        machineId:
          type: integer
          format: int64
          description: Unique identifier of the machine
          example: 1001
        rackId:
          type: integer
          format: int64
          description: Identifier of the rack within the machine
          example: 22
        channelNumber:
          type: integer
          format: int64
          description: Channel number being monitored
          example: 7
        batchSize:
          type: integer
          format: int32
          description: Total size of the current batch
          example: 500
        failedProductCount:
          type: array
          items:
            type: integer
            format: int32
          description: Array of failed product counts per channel/position
          example: [2, 0, 1, 4]
      required:
        - machineId
        - rackId
        - channelNumber
        - batchSize
        - failedProductCount
      example:
        machineId: 1001
        rackId: 22
        channelNumber: 7
        batchSize: 500
        failedProductCount: [2, 0, 1, 4]

    MachineStatusResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/FailedProductDto'
        - type: object
          properties:
            timestamp:
              type: string
              format: date-time
              description: Timestamp when the status was captured
              example: "2025-10-29T02:00:00Z"
          required:
            - timestamp

    ErrorResponse:
      type: object
      required:
        - error
        - message
        - timestamp
      properties:
        error:
          type: string
          description: Error code
          example: "MACHINE_NOT_FOUND"
        message:
          type: string
          description: Human-readable error message
          example: "Machine with ID 1001 was not found"
        details:
          type: array
          items:
            type: string
          description: Additional error details
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
          example: "2025-10-29T02:00:00Z"
        path:
          type: string
          description: Request path that caused the error
          example: "/api/v1/machines/1001/status"

    MachineStatusRequest:
      type: object
      properties:
        machineId:
          type: integer
          format: int64
          description: Unique identifier of the machine
          example: 1001
        fixtureId:
          type: integer
          format: int32
          description: Optional fixture identifier to filter status data
          example: 22
        channelNumber:
          type: integer
          format: int64
          description: Optional channel number to filter status data
          example: 7
        dateRange:
          type: object
          properties:
            startDate:
              type: string
              format: date-time
              description: Start date for the filter
              example: "2025-10-29T00:00:00Z"
            endDate:
              type: string
              format: date-time
              description: End date for the filter
              example: "2025-10-29T23:59:59Z"
        filters:
          type: object
          properties:
            minFailedCount:
              type: integer
              format: int32
              description: Minimum failed product count for filtering
              example: 1
            maxFailedCount:
              type: integer
              format: int32
              description: Maximum failed product count for filtering
              example: 10
            batchSize:
              type: integer
              format: int32
              description: Filter by specific batch size
              example: 500
      required:
        - machineId
      example:
        machineId: 1001
        fixtureId: 22
        channelNumber: 7
        dateRange:
          startDate: "2025-10-29T00:00:00Z"
          endDate: "2025-10-29T23:59:59Z"
        filters:
          minFailedCount: 1
          maxFailedCount: 10
          batchSize: 500
